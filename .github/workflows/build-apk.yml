name: Build Android APK from ZIP
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP File Automatically
        run: |
          mkdir -p extracted_zip
          unzip *buyer*.zip -d ./extracted_zip
          
          # Trik pintar: Cek apakah ada folder di dalam folder, jika ya, keluarkan isinya
          mkdir -p buyer_app
          if [ -f extracted_zip/package.json ]; then
            cp -r extracted_zip/* buyer_app/
          else
            cp -r extracted_zip/*/* buyer_app/ || cp -r extracted_zip/* buyer_app/
          fi
          
          echo "=== Struktur Folder buyer_app ==="
          ls -la buyer_app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd buyer_app
          npm install --legacy-peer-deps

      - name: Build Web Project
        run: |
          cd buyer_app
          npm run build

      - name: Sync Capacitor
        run: |
          cd buyer_app
          npx cap sync android || echo "Tidak ada konfigurasi Capacitor"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Gradle
        run: |
          # Mencari folder android di mana pun berada dan menjalankan gradle build
          ANDROID_DIR=$(find . -type d -name "android" | head -n 1)
          if [ -n "$ANDROID_DIR" ]; then
            cd "$ANDROID_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Folder 'android' (Capacitor) tidak ditemukan di dalam file ZIP Anda!"
            exit 1
          fi

      - name: Upload Buyer APK
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Buyer-Tanaman
          path: "**/app/build/outputs/apk/debug/app-debug.apk"

name: Build Android APK from ZIP
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Buyer ZIP
        run: |
          mkdir -p buyer_app
          unzip *buyer*.zip -d ./buyer_app || echo "No buyer zip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Buyer Web
        run: |
          cd buyer_app
          if [ -f package.json ]; then
            npm install --legacy-peer-deps
            npm run build
            npx cap sync android || echo "No capacitor setup"
          else
            echo "Struktur folder di dalam ZIP salah atau bukan proyek Node/Vite"
            exit 1
          fi

      - name: Setup Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd buyer_app/android
          ./gradlew assembleDebug || echo "Gagal build gradle"

      - name: Upload Buyer APK
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Buyer-Tanaman
          path: buyer_app/android/app/build/outputs/apk/debug/app-debug.apk
